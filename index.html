<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVARA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
}

.logo{
    width:120px;
    border-radius:50%;
}

.hero{
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    margin-bottom:10px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
    max-width:1000px;
    margin:auto;
}

.product{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.product img{
    width:100%;
    height:auto;
    display:block;
}
.product-info{
    padding:10px;
    text-align:center;
}

.product-info h3{
    font-size:14px;
    font-weight:bold;
    margin-bottom:5px;
}

.price{
    color:rgb(0, 0, 0);
    font-size:14px;
    margin:0;
}

.btn{
    display:inline-block;
    background:black;
    color:white;
    text-decoration:none;
    padding:10px 20px;
    border-radius:5px;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}

@media (min-width:768px){
    .products{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>

</head>
<body>

<header>

    <!-- اللوجو -->
    <img src="logo.png" class="logo">

    <h2>ZEVARA</h2>

</header>

<section class="hero">
    <h1>New Collection</h1>
    <p></p>
</section>

<section class="products">

    <div class="product">

        <a href="./gallary.html">
            <img src="product1.jpg">
        </a>

        <div class="product-info">
            <h3>TRY OR DIE</h3>
            <p class="price">550 EGP</p>
        </div>

    </div>

    <div class="product">

        <a href="./black-gallery.html">
            <img src="black1.png">
        </a>

        <div class="product-info">
            <h3>TRY OR DIE</h3>
            <p class="price">550 EGP</p>
        </div>

    </div>

</section>
    
    <script>
        function changeImage(imageSrc){
            document.getElementById("mainImage").src = imageSrc;
        }
        </script>
        
        </body>
        </html>
